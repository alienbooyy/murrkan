<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Restoran Yönetimi</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="header">
        <h1>Admin Panel</h1>
        <div class="header-buttons">
            <button onclick="window.location.href='/'" class="btn btn-secondary">Ana Sayfa</button>
        </div>
    </div>

    <div class="container">
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="showTab('reports')">Raporlar</button>
            <button class="tab-btn" onclick="showTab('products')">Ürünler</button>
            <button class="tab-btn" onclick="showTab('ingredients')">Hammaddeler</button>
            <button class="tab-btn" onclick="showTab('recipes')">Reçeteler</button>
        </div>

        <!-- Reports Tab -->
        <div id="reportsTab" class="tab-content active">
            <div class="section">
                <h2>Günlük Rapor</h2>
                <div class="form-group">
                    <label>Tarih Seçin:</label>
                    <input type="date" id="dailyReportDate" class="form-control">
                    <button onclick="loadDailyReport()" class="btn btn-primary">Rapor Görüntüle</button>
                </div>
                <div id="dailyReportContent" class="report-content">
                    <!-- Daily report will be loaded here -->
                </div>
            </div>

            <div class="section">
                <h2>Tarih Aralığı Raporu</h2>
                <div class="form-group">
                    <label>Başlangıç:</label>
                    <input type="date" id="rangeStartDate" class="form-control">
                    <label>Bitiş:</label>
                    <input type="date" id="rangeEndDate" class="form-control">
                    <button onclick="loadDateRangeReport()" class="btn btn-primary">Rapor Görüntüle</button>
                </div>
                <div id="rangeReportContent" class="report-content">
                    <!-- Range report will be loaded here -->
                </div>
            </div>

            <div class="section">
                <h2>En Çok Satan Ürünler</h2>
                <div id="topProductsContent" class="report-content">
                    <!-- Top products will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Products Tab -->
        <div id="productsTab" class="tab-content">
            <div class="section">
                <h2>Ürün Yönetimi</h2>
                <button onclick="showAddProductModal()" class="btn btn-success">Yeni Ürün Ekle</button>
                <div id="productsList" class="data-table">
                    <!-- Products table will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Ingredients Tab -->
        <div id="ingredientsTab" class="tab-content">
            <div class="section">
                <h2>Hammadde Yönetimi</h2>
                <button onclick="showAddIngredientModal()" class="btn btn-success">Yeni Hammadde Ekle</button>
                <div id="ingredientsList" class="data-table">
                    <!-- Ingredients table will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Recipes Tab -->
        <div id="recipesTab" class="tab-content">
            <div class="section">
                <h2>Reçete Yönetimi</h2>
                <div class="form-group">
                    <label>Ürün Seçin:</label>
                    <select id="recipeProductSelect" class="form-control" onchange="loadRecipe()">
                        <option value="">Ürün seçin...</option>
                    </select>
                </div>
                <div id="recipeContent">
                    <!-- Recipe items will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="productModalTitle">Yeni Ürün Ekle</h2>
                <span class="close" onclick="closeProductModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label>Ürün Adı:</label>
                        <input type="text" id="productName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Fiyat (₺):</label>
                        <input type="number" id="productPrice" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Kategori:</label>
                        <select id="productCategory" class="form-control" required>
                            <option value="Yemek">Yemek</option>
                            <option value="İçecek">İçecek</option>
                            <option value="Tatlı">Tatlı</option>
                            <option value="Diğer">Diğer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Yazıcı:</label>
                        <select id="productPrinter" class="form-control">
                            <option value="kitchen">Mutfak</option>
                            <option value="oven">Fırın</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Açıklama:</label>
                        <textarea id="productDescription" class="form-control"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveProduct()">Kaydet</button>
                <button class="btn btn-secondary" onclick="closeProductModal()">İptal</button>
            </div>
        </div>
    </div>

    <!-- Add Ingredient Modal -->
    <div id="ingredientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="ingredientModalTitle">Yeni Hammadde Ekle</h2>
                <span class="close" onclick="closeIngredientModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="ingredientForm">
                    <input type="hidden" id="ingredientId">
                    <div class="form-group">
                        <label>Hammadde Adı:</label>
                        <input type="text" id="ingredientName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Birim:</label>
                        <select id="ingredientUnit" class="form-control" required>
                            <option value="gr">Gram (gr)</option>
                            <option value="kg">Kilogram (kg)</option>
                            <option value="adet">Adet</option>
                            <option value="lt">Litre (lt)</option>
                            <option value="ml">Mililitre (ml)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stok Miktarı:</label>
                        <input type="number" id="ingredientStock" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Minimum Stok:</label>
                        <input type="number" id="ingredientMinStock" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Birim Maliyet (₺):</label>
                        <input type="number" id="ingredientCost" class="form-control" step="0.01" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveIngredient()">Kaydet</button>
                <button class="btn btn-secondary" onclick="closeIngredientModal()">İptal</button>
            </div>
        </div>
    </div>

    <!-- Add Recipe Item Modal -->
    <div id="recipeItemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reçete Malzemesi Ekle</h2>
                <span class="close" onclick="closeRecipeItemModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="recipeItemForm">
                    <div class="form-group">
                        <label>Hammadde:</label>
                        <select id="recipeIngredient" class="form-control" required>
                            <option value="">Seçin...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Miktar:</label>
                        <input type="number" id="recipeQuantity" class="form-control" step="0.01" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="saveRecipeItem()">Ekle</button>
                <button class="btn btn-secondary" onclick="closeRecipeItemModal()">İptal</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
